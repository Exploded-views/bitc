  { id = "SW2", task = "2.7", ported = "TestSW2_StatusShowsOwnAndForeignResourcesAndSpend", desc = "status lists own and foreign remote resources and today's spend" },
  { id = "SW3", task = "S.3", ported = "TestSW3_DoctorRemoteSprites", desc = "doctor --remote for Sprites: fail when no sweep ran in the last 30 minutes (a dry run is none), ok after one; fail on any Connector, on a Sprite outside name_prefix and on a Sprite of another organization (named, with the api line failing too); warn when more than one install holds Sprites and on another install's expired Sprite; the token never printed" },
  { id = "SW4", task = "S.3", ported = "TestSW4_StatusSpritesSection", desc = "status --json for Sprites matches the schema: another install's Sprites under foreign, est_usd_today, last_sweep after a sweep, and foreign_org naming a Sprite of another organization with the listing error" },

  # RL: remote library (one row per reference block)
  { id = "RL1", task = "2.3", ported = "TestRL1_Defaults", desc = "RunPod keys have the documented defaults (api_base, proxy_domain, cloud, disk, port)" },
  { id = "RL2", task = "2.3", ported = "TestRL2_UnknownSizePricedHighest", desc = "sizes map a size key to cpu type, vCPU and price; an unknown size key is priced at the highest price" },
  { id = "RL3", task = "1.2b", ported = "TestRL3_HostKeysOnlyFromHostFile", desc = "files load in order defaults, host, repo, env, flags, with host keys only from the host file" },
  { id = "RL4", task = "1.2b", ported = "TestRL4_ProviderSettingsInEnvIgnored", desc = "provider settings in the caller's environment are ignored" },
  { id = "RL5", task = "2.3", ported = "TestRL5_KeyOnlyInTheAuthorizationHeader", desc = "the API key reaches the API only in a request header, never argv, a file or a URL" },
  { id = "RL6", task = "1.2b", changed = "config-78", test = "TestRL6_CredentialFileRules", desc = "a credential file must exist, be 0600, owned by the user and hold one bare key line" },
  { id = "RL7", task = "2.3", ported = "TestRL7_MethodBodyStatus", desc = "API calls send method and body and return status and body" },
  { id = "RL8", task = "2.3", ported = "TestRL8_HTTPMapping", desc = "HTTP and network failures map to transient, ineligible or unavailable as specified" },
  { id = "RL9", task = "2.3", ported = "TestRL9_ListOnlyConfiguredPrefixes", desc = "listing returns only resources with the configured prefixes, with id, name, created time and expiry from the name" },
  { id = "RL10", task = "2.3", ported = "TestRL10_UnparsableNameCountedHigh", desc = "a resource whose name or created time cannot be parsed is counted at the highest price and longest duration" },

  # SX: secrets (rail; ported by 1.7 once the pipeline wraps its sinks)
  { id = "SX1", task = "1.7", ported = "TestSX1_CredentialNeverInBitcsSinks", desc = "a configured credential never appears in bitc's stderr lines, history.jsonl or result.json" },
  { id = "SX2", task = "1.7", ported = "TestSX2_NoCredentialInTheCommandsEnvOrArgv", desc = "bitc adds no credential to the command's environment or to any argv it starts" },
  # CF: configuration (bitc-only behaviours)
  { id = "CF1", task = "1.2b", ported = "TestCF1_MinVersion", desc = "min_version newer than the binary is 78 before unknown keys are reported" },
  { id = "CF2", task = "1.2b", ported = "TestCF2_AllUnknownKeysListed", desc = "config check lists every unknown key with its line" },
  { id = "CF3", task = "1.2b", ported = "TestCF3_ExamplesPassCheck", desc = "the shipped example configs pass config check" },
  { id = "CF4", task = "1.2b", ported = "TestCF4_ExplainRedactsCredentials", desc = "config explain prints credentials as <redacted>" },
  { id = "CF5", task = "1.2b", ported = "TestCF5_RepoGrantSuppliesRepoFile", desc = "without .bitc.toml, the first matching [[repos]] grant's config is the repo file" },
  { id = "CF6", task = "1.2b", ported = "TestCF6_RepoSectionForUnknownPoolWarns", desc = "a repo section for a pool the host lacks is ignored with one warning" },
  { id = "CF7", task = "1.2b", ported = "TestCF7_RemoteEnvCheck", desc = "a remote-capable pool's env key using a host-only variable must be overridden or unset remotely (78)" },
  { id = "CF8", task = "1.2b", ported = "TestCF8_SecretLikeForwardEnvNeedsForce", desc = "a forwarded variable named like a secret must be in forward_env_force (78)" },
  { id = "CF9", task = "1.2b", ported = "TestCF9_WritableConfigRefused", desc = "a group- or world-writable config file is 78" },
  { id = "CF10", task = "1.12", ported = "TestCF10_WiderSecretLikeNamesNeedForce", desc = "a forwarded variable whose name contains PASS, CREDENTIAL, AUTH, DSN, PRIVATE, COOKIE, SESSION, CERT, DATABASE_URL or DIRECT_URL (any case) is secret-like too and must be in forward_env_force (78)" },
  { id = "CF11", task = "1.12", ported = "TestCF11_ForwardEnvEntriesMustBeVariableNames", desc = "every entry of remote.forward_env, remote_limits.forward_env_allow and remote_limits.forward_env_force must be a valid env name (not 1BAD, BAD-NAME, A=B, A$(x) or BITC_*), else 78 at load" },

  # HK: env and hooks (bitc-only)
  { id = "HK1", task = "1.5b", ported = "TestHK1_CRLFHookOutputIsUnparsable", desc = "env hook output with CRLF line endings is unparsable (69), never a value with a trailing CR" },
  { id = "HK2", task = "1.5b", ported = "TestHK2_HookTimeoutIs69", desc = "a hook past its timeout is killed and the call exits 69" },
  { id = "HK3", task = "1.5b", ported = "TestHK3_Hook75IsStarvedWithReason", desc = "a hook exiting 75 is STARVED <pool> (<hook>: <first stderr line>)" },
  { id = "HK4", task = "1.5b", ported = "TestHK4_PreRunAndPostRun", desc = "a refusing pre_run is 64 before queueing; a failing post_run only warns and sees BITC_EXIT" },
  { id = "HK5", task = "1.5b", ported = "TestHK5_WrapPrefixesByWorktree", desc = "the first wrap rule matching the work tree prefixes the command" },
  { id = "HK6", task = "1.5b", ported = "TestHK6_HookEnvPrintsTheParse", desc = "config hook-env runs an env hook without a lock and prints the parse" },
  { id = "HK7", task = "1.5b", ported = "TestHK7_PreRunCannotUseSlot", desc = "{slot} or {hold} in a pre_run argv is a config error (pre_run runs before a slot is held)" },
  { id = "HK8", task = "1.5b", ported = "TestHK8_BackgroundChildOfAHookNeitherStallsNorTimesItOut", desc = "a hook that exits 0 and leaves a background child returns on its own exit status, never a false timeout" },
  { id = "HK9", task = "1.5b", ported = "TestHK9_DaemonizedChildOfAHookNeverHangsTheRun", desc = "a hook child that left the hook's group never hangs the run or turns success into a timeout; a real overrun is still 69" },

  # RN: process runner (bitc-only)
  { id = "RN1", task = "1.5a", ported = "TestRN1_TTYStdinKeepsTheCallersGroup", desc = "with a TTY stdin the command stays in the caller's process group" },
  { id = "RN2", task = "1.5a", ported = "TestRN2_SigkilledSupervisorLeavesNoProcess", desc = "a SIGKILLed supervisor's command dies at once (Pdeathsig) and the next admission reaps the rest of its group" },
  { id = "RN3", task = "1.5a", ported = "TestRN3_TerminateExits128PlusN", desc = "terminate forwards the signal, SIGKILLs after grace and exits 128+N" },
  { id = "RN4", task = "1.5a", ported = "TestRN4_ForwardAndWaitIsBounded", desc = "forward-and-wait gives up after max_signal_wait and terminates" },
  { id = "RN5", task = "1.5a", ported = "TestRN5_ClosedPipeAndFlood", desc = "a closed output pipe or a flood of output never hangs bitc or keeps the slot; the code passes through" },
  { id = "RN6", task = "1.5a", ported = "TestRN6_CommandNotFoundOrNotExecutable", desc = "a missing command exits 127 and a non-executable one 126, with a bitc: line naming it" },
  { id = "RN7", task = "1.5a", ported = "TestRN7_TTYHoldReapsOnlyTheCommandTree", desc = "a TTY hold records only the command; the reap after its supervisor died kills the command and its live descendants, never other members of the caller's group (orphans of a Pdeathsig-killed TTY command are left: they cannot be told apart)" },
  { id = "RN8", task = "1.5a", ported = "TestRN8_RepeatedSignalsNeverPostponeTheKill", desc = "repeated signals in terminate mode never push the SIGKILL back past grace" },

  # PI: pipeline (bitc-only)
  { id = "PI1", task = "1.7", ported = "TestPI1_AwkwardPathsAndArgv", desc = "paths and argv with spaces, quotes, newlines, empty words and non-ASCII pass verbatim and are recorded losslessly; truncating history never shortens the command's argv" },
  { id = "PI2", task = "1.7", ported = "TestPI2_BookkeepingFailureKeepsExitCode", desc = "an unwritable history or result file warns and never changes the command's exit code" },
  { id = "PI3", task = "1.7", ported = "TestPI3_InternalErrorIs69NeverGo2", desc = "a panic prints bitc: internal error: <msg> and exits 69" },
  { id = "PI4", task = "1.7", ported = "TestPI4_ResultJSONForAForegroundRun", desc = "--result writes result.json with origin, outcome, exit code, pool, slot and job, also for a run refused before admission" },
  { id = "PI5", task = "1.7", ported = "TestPI5_SignalWhileWaitingIs128PlusNAndLeavesNothing", desc = "a signal while waiting exits 128+N and removes the ticket" },
  { id = "PI6", task = "1.7", ported = "TestPI6_StarvedAndReapedAreHistoryEvents", desc = "a starved call writes a starved history event" },
  { id = "PI7", task = "1.7", ported = "TestPI7_BitcLogLevels", desc = "BITC_LOG=debug (or -v) prints bitc: debug: lines, info and quiet do not, quiet wins over -v, and another value is 64" },
  { id = "PI8", task = "1.7", ported = "TestPI8_SignalDuringPostRunKeepsTheCommandsResult", desc = "a signal while post_run runs cuts the hook short; the command's code and result.json still come back" },

  # CM: compat mode (bitc-only, removed with [compat] a week after M1 exit)
  { id = "CM1", task = "1.10", ported = "TestCM1_NoDoubleAdmissionEitherWay", desc = "with [compat], a legacy slot holder makes the bitc slot busy and a bitc hold takes the legacy slot lock" },
  { id = "CM2", task = "1.10", ported = "TestCM2_LegacyHoldsSlotOneBitcTakesSlotTwo", desc = "a legacy hold of slot 1 sends bitc to slot 2 with slot 2's derived values" },
  { id = "CM3", task = "1.10", ported = "TestCM3_NestedLegacyCallsVerifyBothWays", desc = "a verified legacy nested claim counts as nested for its group; an unverified caller meets the legacy lock" },
  { id = "CM4", task = "1.10", ported = "TestCM4_BitcHoldIsVisibleToNestedLegacyCalls", desc = "a bitc group hold writes its supervisor pid into the legacy lock and exports hold_env" },
  { id = "CM5", task = "1.10", ported = "TestCM5_PriorityMarkersBothWays", desc = "a live legacy priority marker holds normal bitc callers back; a bitc high hold is mirrored as <pool>.prio.<pid> until release" },
  { id = "CM6", task = "audit-E", ported = "TestCM6_UnderscoreSpelledGroupStillMeetsLegacyLock", desc = "a group spelled with underscores in [compat].groups still takes the legacy lock stem (keys are canonicalised)" },
  { id = "CM7", task = "audit-E", ported = "TestCM7_CompatGroupKeysMustNameDeclaredGroups", desc = "a [compat].groups key naming no declared group, or a duplicate after canonicalisation, is a config error (78)" },

  # PV: providers and selection (bitc-only)
  { id = "PV1", task = "2.1a", ported = "TestPV1_NoProviderLeft69Or75", desc = "with no provider left the call is 69 after an ineligible or unavailable failure, else 75; with no local entry after the provider (a remote-only pool) no failure prints the running-locally note, and an ineligible job ends 69 with 'bitc: <provider>: <pool>: not eligible for remote: <why>' alone and never runs locally" },
  { id = "PV2", task = "2.1a", ported = "TestPV2_OnFailureStopDoesNotFallBack", desc = "on_failure = \"stop\" ends the walk at a pre-start failure" },
  { id = "PV3", task = "2.1a", ported = "TestPV3_FailureAfterBeginIs75NeverFallback", desc = "an infrastructure failure after the command started is 75, never a fallback" },
  { id = "PV4", task = "2.1a", ported = "TestPV4_FakeProviderOnlyWithATestTable", desc = "the fake provider type is a config error without a [test] table" },
  { id = "PV5", task = "2.1a", ported = "TestPV5_ProviderSuiteOnFake", desc = "the provider conformance suite (including a resource created then failed before BEGIN: 75, torn down, never a local run; and the repo's own setup step failing after create: 69, torn down, never STARVED or local) passes on the fake provider" },
  { id = "PV6", task = "2.1a", ported = "TestPV6_QuietHidesLaunchAndPodLines", desc = "BITC_LOG=quiet hides a remote job's launch line and pod: lines, never its fallback notes or STARVED" },
  { id = "PV7", task = "2.1a", ported = "TestPV7_RepoSetupFailureIs69TornDownNoFallback", desc = "a setup step of the repo's own that fails by itself after create is torn down and exits 69 with the setup-step line, never STARVED, a fallback or a breaker record (spec 15.9)" },

  # RA: rails (bitc-only)
  { id = "RA1", task = "2.4", ported = "TestRA1_RunningJobCountedOnce", desc = "a running job is counted once: its reservation stops counting when its resource is listed" },
  { id = "RA2", task = "2.4", ported = "TestRA2_SecondStateDirCannotExceedTheCap", desc = "a second BITC_DIR shares the fixed accounting dir and cannot add its own allowance" },
  { id = "RA3", task = "2.4", ported = "TestRA3_OtherInstallsAndAccountSpendCount", desc = "another install's live resource and the whole account's spend count against the cap" },
  { id = "RA4", task = "2.4", ported = "TestRA4_CompatSharesLegacyLaunchLockAndReservations", desc = "with [compat], launches also take the legacy launch lock and append a legacy reservation line, removed at the end" },
  { id = "RA5", task = "2.4", ported = "TestRA5_UnavailablePausesTheProvider", desc = "a provider-side ErrUnavailable (auth, no balance) writes one pause record; the next call falls back with '<type> is paused' without calling the provider" },
  { id = "RA6", task = "2.4", ported = "TestRA6_LedgerCountsCreatedJobsOnlyAndOnce", desc = "without a spend API, capacity fallbacks cost nothing and a running job is counted once (listed, not again from the ledger)" },
  { id = "RA7", task = "2.4", ported = "TestRA7_FailureAfterCreateBeforeBeginIs75NoBreaker", desc = "a failure after the create and before BEGIN ledgers end 75 (never fallback), tears down and records no breaker failure" },

  # TR: transport (bitc-only)
  { id = "TR1", task = "2.5", ported = "TestTR1_CredentialsInTheOriginAreNeverSent", desc = "credentials in the origin URL are never sent, printed or recorded" },
  { id = "TR2", task = "2.5", ported = "TestTR2_PortInTheRemoteIsIneligible", desc = "an https remote with a port is ineligible until the grant sets clone_url" },
  { id = "TR3", task = "2.5", ported = "TestTR3_PushTakesTurnsInTheGitPool", desc = "with a git pool defined, the push runs through it; a busy git pool makes the remote attempt fall back" },

  # OR: orchestration (bitc-only)
  { id = "OR1", task = "2.6a", ported = "TestOR1_ForgedResultIs75", desc = "a result.json that fails its MAC or disagrees with the exit marker is 75 '<id> result failed verification'" },
  { id = "OR2", task = "2.6a", ported = "TestOR2_CancelOfARemoteDetachedJob", desc = "bitc cancel of a detached remote job tears the resource down, records interrupted, trips no breaker and ends 143" },
  { id = "OR3", task = "2.6a", ported = "TestOR3_RepoSetupFailureIs69NoBreaker", desc = "a repo setup step that fails by itself tears the pod down and exits 69 'bitc: <provider>: <pool>: setup step <name> failed: <first error line>', ledger 69, no breaker record, never STARVED or a fallback (spec 15.9)" },
  { id = "OR4", task = "2.6a", ported = "TestOR4_BeginSurvivesALogStreamThatStallsAfterTheFirstBatch", desc = "a log stream that returns nothing after its first batch does not hide BEGIN: the host reads state.json on the status tick, begins, tails the output and returns the exit (live bug 2026-10-23)" },
  { id = "OR5", task = "2.6a", ported = "TestOR5_RestartWithoutASecondBootIsSeenFromStartedAt", desc = "a pod whose startedAt changes after BEGIN with no second BOOT (build mode, agent ref gone; live proof case C 2026-10-23) ends 75 `restarted while the command ran` and is torn down" },
  { id = "OR6", task = "2.6a", ported = "TestOR6_OutputIsStreamedWhileTheJobRuns", desc = "a RunPod job's output reaches the caller while the job runs: the results server serves the growing out.log and err.log by Range, a line printed before the job's gate is on the caller's stdout before the job ends, and the total output is exact (live proof 2026-10-23)" },
  { id = "OR7", task = "2.6a", ported = "TestOR7_LogReadsAreTailOnlyAndA429BurstIsBackedOff", desc = "container-log reads are tail=5000 only (no since=), a 429 burst on the log endpoint is backed off, and the job still completes with exact output and exit (live proof 2026-10-23)" },
  { id = "RP1", task = "2.6a", ported = "TestRP1_ProviderSuiteOnRunPodFake", desc = "the provider conformance suite (launch, fallback, setup failure after create: 75 and torn down, never local, the repo's own setup step failing after create: 69 and torn down, lost, cap, breaker, restart, interrupt, dropped tail, forged result, artifacts; sweep from 2.7) passes on the RunPod fake API" },

  # X1: exec delivery and arch (providers delta X.1, bitc-only)
  { id = "AR1", task = "X.1", ported = "TestAR1_PoolArchIsValidatedAndDefaultsToAmd64", desc = "a pool's remote arch list holds amd64 and arm64 only, once each, and defaults to amd64; anything else is 78 at pools.<p>.remote.arch" },
  { id = "AR2", task = "X.1", ported = "TestAR2_ToolArchIsValidatedAndNameArchIsUnique", desc = "a tool entry may carry arch (amd64 or arm64, default amd64); an invalid arch or a repeated (name, arch) is 78" },
  { id = "AR3", task = "X.1", ported = "TestAR3_PoolArchMustIntersectTheProvidersArch", desc = "a job's arch is the first pool arch the provider can run (Info.Arch; amd64 when unset); with no overlap the job is ineligible: arch <provider's> not allowed by pool (arch = [...])" },
  { id = "AR4", task = "X.1", ported = "TestAR4_ToolWithoutAnEntryForTheJobsArchIsIneligible", desc = "a tool name with no entry for the job's arch makes the job ineligible (tool <name> has no <arch> entry); the provider receives only the entries for that arch" },
  { id = "AR5", task = "X.1", ported = "TestAR5_AgentSourceKeysPerArchAreValidatedAtLoad", desc = "agent keys per arch are validated at load: url may carry {arch}, paths maps amd64/arm64 to local files (path is the amd64 alias), build takes module_dir alone as an absolute path holding this module's go.mod" },
  { id = "AR6", task = "X.1", ported = "TestAR6_UrlSourceServesEachArchFromItsOwnFile", desc = "a url agent source expands {arch} and sends the sha256 of paths[arch]; an arch with no paths entry makes the job ineligible" },
  { id = "AR7", task = "X.1", ported = "TestAR7_ReleaseSourceTakesTheArchsShaFromChecksums", desc = "the release source picks bitc_<ver>_linux_<arch> and its sha256 from the release's checksums.txt; a missing line is ineligible, a failed fetch transient" },
  { id = "AR8", task = "X.1", ported = "TestAR8_BuildSourceCrossCompilesOncePerArchAndTreeState", desc = "source build with module_dir runs CGO_ENABLED=0 GOOS=linux GOARCH=<arch> go build -trimpath -ldflags=-buildid= ./cmd/bitc into <account>/agents/<arch>/<sha256>, once per arch and tree state" },
  { id = "AR9", task = "X.1", ported = "TestAR9_BuildSourceNeedsACleanGitTree", desc = "a module_dir build refuses a tree that is not a git work tree or has uncommitted or untracked changes; url-based providers cannot use a module_dir source" },
  { id = "AR10", task = "X.1", ported = "TestAR10_BuildRecipeCrossCompilesForTheGivenArch", desc = "the agent build recipe cross-compiles for linux/<arch> (CGO off) when given amd64 or arm64 and builds natively without one" },
  { id = "AR11", task = "X.1", ported = "TestAR11_BuildScriptsTakeAnArchAndRefuseOthers", desc = "agent-build-sha.sh and repro-check.sh take an optional arch (amd64 default, arm64) and exit 64 for anything else, before any git or docker call" },
  { id = "AR12", task = "X.1", ported = "TestAR12_ReleaseConfigBuildsBothArchsStaticallyWithRawBinaries", desc = "the release config builds linux and darwin, amd64 and arm64, with CGO off and publishes the bare binaries and their sha256s in checksums.txt beside the tarballs" },
  # REL: release (bitc-only)
  { id = "REL1", task = "3.1", ported = "TestREL1_ReleaseStampInVersion", desc = "a release-pipeline build reports release=true and its version" },
  { id = "REL2", task = "3.1", ported = "TestREL2_ReleaseSourceNeedsAReleaseBuild", desc = "the agent release source is usable only by a release build; others need source = url; the release URL is on the public repo" },
  { id = "REL3", task = "3.1", ported = "TestREL3_ReleaseTargetsThePublicRepoAsADraft", desc = "the release config targets the public repo as a draft, the Makefile has release-check verifying all eight assets (linux and darwin tarballs and bare binaries) against checksums.txt, and RELEASING.md names the release URL and lists the eight assets" },
  { id = "REL4", task = "3.1", ported = "TestREL4_ReleaseWorkflowUploadsADraftWithTheJobToken", desc = "release.yml: a goreleaser dry run (check, snapshot, --skip=publish, no secret) on pull requests; on a pushed v* tag goreleaser uploads a draft with the job's own GITHUB_TOKEN; contents: write only under the release job, read at the top; pins, toolchain and tools as ci.yml; .goreleaser.yaml stays draft; RELEASING.md names no personal token" },
  { id = "AR13", task = "X.1", ported = "TestAR13_DoctorRemoteExits78ForAnUnusableModuleDir", desc = "doctor --remote prints a fail line and exits 78 for an agent module_dir that is not a clean git tree (ineligible at run), and exits 0 for a clean one" },
  { id = "XD1", task = "X.1", ported = "TestXD1_NoListenerModeRunsOnceAndExits", desc = "no-listener mode (spec port -1): the agent binds nothing, mirrors its stdout to agent.log in the results dir, records agent.pid, runs the job once and exits by itself after result.json; a second boot is LOST and exits" },
  { id = "XD2", task = "X.1", ported = "TestXD2_BootPayloadIsLengthPrefixedAndTruncationRefused", desc = "the boot payload is an 8-byte big-endian length then that many bytes of JSON; EOF before it, a zero length or bad JSON is a truncated payload, and over 8 MiB is refused" },
  { id = "XD3", task = "X.1", ported = "TestXD3_BootStdinThroughTheBinary", desc = "__agent --boot-stdin reads the payload from stdin, re-execs through the memfd with no listener and runs the job to exit 0; a truncated payload or a listener spec prints refused: <why>, exits 65 and starts nothing" },
  { id = "XD4", task = "X.1", ported = "TestXD4_DeployKeyIsStrippedFromThePayloadStageTwoReads", desc = "the deploy key is taken out of the payload that survives the re-exec; no memfd of the running agent holds it and its environment is empty" },
  { id = "XD5", task = "X.1", ported = "TestXD5_ReadServesOnlyListedFilesOfAValidJob", desc = "__agent read serves only the result files of a job with a valid id, never a .part, a link or another name, from an offset; a bad job or file name is refused with nothing written" },
  { id = "XD6", task = "X.1", ported = "TestXD6_ReadAndListCommandsExitCodes", desc = "the exec verbs exit 64 for a bad argument, 65 for an offset past the end and 66 for a missing file, with nothing on stdout; list prints one JSON line per job" },
  { id = "XD7", task = "X.1", ported = "TestXD7_TailStreamsByOffsetWithHeartbeatsAndEnds", desc = "__agent tail streams agent.log, out.log and err.log as offset frames from the host's resume points, with heartbeats carrying alive, ends with done after result.json, and ends at once for an agent that is gone without a result" },
  { id = "XD8", task = "X.1", ported = "TestXD8_TeardownKillsTheRecordedProcessesOnlyAndRemovesTheJob", desc = "__agent teardown kills the job group and the agent only while their recorded pid and start time match, removes the job directory and prints torn <job> or gone" },
  { id = "XD9", task = "X.1", ported = "TestXD9_TailDoesNotSayDoneBeforeTheAgentHasWrittenExit", desc = "__agent tail ends with done only when result.json exists, the recorded agent has exited and a final drain sent everything, so the host always receives the EXIT marker" },
  { id = "XD10", task = "X.1", ported = "TestXD10_ASecondBootKeepsTheFirstAgentsIdentity", desc = "a second --boot-stdin of a running job is LOST and leaves agent.pid naming the first agent: tail still reports it alive and teardown still kills it" },
  { id = "XD11", task = "X.1", ported = "TestXD11_TheJobSurvivesTheBootChannelDropping", desc = "in no-listener mode agent.log is written first and stdout is best effort: after the boot exec's stdout closes the job still finishes with result.json and BEGIN and EXIT in agent.log" },
  # FB, PS: fallback boundary and provider-suite list completeness (bitc-only, providers delta B)
  { id = "FB1", task = "F.1", ported = "TestFB1_FallbackUntilDefaultNarrowAndValidation", desc = "providers.<t>.fallback_until defaults to the provider's declaration for a built-in (resource for a plugin); the host may narrow it; a value past the declaration, a bad value and a repo-file key are 78; the repo-file 78 names providers.<t>.fallback_until: host-only key" },
  { id = "FB2", task = "F.1", ported = "TestFB2_PreAttachDiscardRetriesOnceThenFallsBack", desc = "a pre-attach failure under attach, teardown ok: one retry with a new name and reservation, then the next provider with the 'torn down before attach' suffix; one ledger launch and end per attempt name; the job has at most one retry in total, whichever order a capacity retry and a pre-attach retry come in; the retry's rails (the cap with the discarded minutes) run again; a retry that attaches runs the command on the provider" },
  { id = "FB3", task = "F.1", ported = "TestFB3_PreAttachUnderResourceIs75", desc = "a pre-attach failure under a narrowed resource boundary is read as attached: torn down, 75, no other provider tried" },
  { id = "FB4", task = "F.1", ported = "TestFB4_PostAttachNeverFallsBack", desc = "an attached failure, or any failure after the handle, is 75 under both boundaries; a repo setup failure after the handle is 69" },
  { id = "FB5", task = "F.1", ported = "TestFB5_PreAttachRepoSetupFailureIs69", desc = "a repo-class setup failure before attach exits 69 with no fallback, no retry and no breaker record" },
  { id = "FB6", task = "F.1", ported = "TestFB6_TryingNoteOnlyForARemoteNext", desc = "'trying <next>' is noted only when the next provider is remote, 'running locally' only when local is next; an ineligible job whose next provider is remote prints the not-eligible line, never the trying note, and the walk goes on" },
  { id = "FB7", task = "F.1", ported = "TestFB7_UnconfirmedDiscardIsAnOrphanAndNeverRetried", desc = "a failed teardown before attach: no retry, 'left for sweep', an orphan reservation that outlives the process, counts while unlisted, and never shields its resource from the sweep or the next launch's cap check; a listed orphan counts once; a live reservation of the same name protects it; the sweep tears it down while the job's process still runs" },
  { id = "FB8", task = "F.1", ported = "TestFB8_StopEndsTheWalkAfterThePreAttachRetry", desc = "on_failure = \"stop\" after a pre-attach failure ends the walk after the one retry" },
  { id = "FB9", task = "F.1", ported = "TestFB9_RunPodKeepsTheResourceBoundary", desc = "RunPod declares resource: a create that left a pod is never retried and ends 75; a create that left nothing is retried once, then falls back; a 429 on create is retried once, then 'trying <next>' for a remote next provider" },
  { id = "FB10", task = "P.1", ported = "TestFB10_AmbiguousLaunchTimeoutIsReapedAnd75", desc = "a plugin launch that times out after the resource was created is ambiguous: reaped by name, 75 with 'launch ambiguous', one breaker failure, no retry and no next provider, under both boundaries" },
  { id = "FB11", task = "P.1", ported = "TestFB11_PluginKilledMidLaunchIsReapedOnTheRespawn", desc = "a plugin killed (SIGKILL) mid-launch after the create: a respawned plugin reaps the resource by name, 75, no next provider" },
  { id = "FB12", task = "P.1", ported = "TestFB12_MalformedOrUnknownLaunchOutcomeIsAmbiguous", desc = "a malformed frame, a final error of an unknown class (with and without an id) or a begun/ended phase event mid-launch after the create: reaped by name, 75, no next provider" },
  { id = "FB13", task = "P.1", ported = "TestFB13_ClassifiedLaunchErrorsFollowTheBoundary", desc = "a plugin launch error transient with an id is 75 under both boundaries; pre_attach under a narrowed or default resource boundary is 75; pre_attach under attach takes the FB2 path (teardown, one retry on a new name, then the next provider)" },
  { id = "FB14", task = "F.1", ported = "TestFB14_DiscardsFeedTheBreaker", desc = "each resource discarded before attach is one breaker failure and the provider pauses after failures of them; a create that left nothing writes none" },
  { id = "FB15", task = "F.1", ported = "TestFB15_NothingCrossesBeforeAttach", desc = "provider suite: for a target that declares attach (the fake and the reference plugin), no job input (B, K, M, argv, forwarded env) appears in any fake API call before the call marked attach" },
  { id = "PD1", task = "P.1", ported = "TestPD1_DoctorRemotePluginConfigErrorsAre78", desc = "doctor --remote: a plugin configuration error (configure class config, fallback_until wider than declared) is a 'fail plugin-<type>' line and exit 78 with 'bitc: <file>: providers.<type>: <why>', not 69" },
  { id = "PD2", task = "P.1", ported = "TestPD2_DoctorRemotePluginReportsProtocolVersionAndPin", desc = "doctor --remote: a started plugin prints 'ok plugin-<type>: protocol 1, <plugin version>, sha256 <first 12>'" },
  { id = "PS1", task = "F.1", ported = "TestPS1_ListCompleteness", desc = "provider suite: with a paginated list and five overlapping jobs, the provider's list equals the fake's live set after each launch, job end and teardown (fake, RunPod and the reference plugin)" },
  { id = "PL1", task = "P.2", ported = "TestPL1_UnknownFieldsAreIgnoredAndMissingOrMistypedOnesAreProtocolErrors", desc = "plugin: unknown fields in hello, configure, results, events and errors are ignored by bitc; a missing required field (hello caps, configure endpoints) or a wrong type (list resources) is a protocol error" },
  { id = "PL2", task = "P.2", ported = "TestPL2_ConfigureSuppliesEndpointsAndArch", desc = "plugin: endpoints, arch and max_name come from configure; under [test] a non-loopback endpoint is 78 with the endpoint named; an arm64-only plugin is ineligible for an amd64 pool" },
  { id = "PL3", task = "P.2", ported = "TestPL3_EstimateIsFlooredByTheHostPriceAndRangeChecked", desc = "plugin: an estimate of 0 prices the job at the host price times E minus now; a negative or non-integer usd_micros is over the cap and nothing is launched" },
  { id = "PL4", task = "P.2", ported = "TestPL4_AnOmittedLiveResourceIsStillCountedByItsReservation", desc = "plugin: a list that omits a live reserved resource is still counted by its reservation in max_live" },
  { id = "PL5", task = "P.2", ported = "TestPL5_OutOfRangeListEntriesCountAsOverTheCap", desc = "plugin: a list entry outside the requested prefixes, or with a negative usd_per_hour, is a protocol error that counts as over the cap, with no launch" },
  { id = "PL6", task = "P.2", ported = "TestPL6_ASpendBelowTheLedgerIsIgnored", desc = "plugin: a spend figure below today's ledger changes nothing: committed uses the ledger" },
  { id = "PL7", task = "P.2", ported = "TestPL7_PerProcessTmpdirsSurviveEachOtherAndDeadOnesArePruned", desc = "plugin: two bitc processes with one plugin never remove each other's TMPDIR; a dead process's directory is pruned at the next spawn; each is removed when its plugin exits" },
  { id = "PL8", task = "P.2", ported = "TestPL8_SecretsArriveOnFd3AndAreRedactedEverywhere", desc = "plugin: secret_files values arrive on fd 3 and in no argv or env, config and doctor never print them, a declared secret given inline is 78; fault echo-launch (and a protocol-error tail) shows none of B, K, M (raw or hex) or a forced value under BITC_LOG=debug (the deploy key part waits for core to hand a grant's deploy key to plugin launches)" },
  { id = "PL9", task = "P.2", ported = "TestPL9_MaxNameBelow60Is78AndNamesFitAt60", desc = "plugin: configure max_name 59 is 78 with the A.8 message; 60 gives names of at most 60 characters with job8 and E intact for a 10-character prefix and size key" },
  { id = "PL10", task = "P.2", ported = "TestPL10_TheJobObjectMatchesTheGoldenFile", desc = "plugin: the job object of a scripted launch equals conformance/plugin/testdata/job-v1.json after key sorting: snake_case keys, hex B/K/M, RFC 3339 times, timeout_s, no deploy_secret, no test without [test]; the deploy key only in secrets" },
  { id = "PL11", task = "P.2", ported = "TestPL11_CreateThenTransientWithoutAnIDIsCaughtByTheNameCheck", desc = "plugin fault create-then-transient-no-id: the name check finds the resource, tears it down, one breaker failure, 75 'launch said transient but <name> exists', no retry and no next provider; with a failing list the launch is ambiguous (75, no other provider) and the resource is still reaped on the respawned plugin (torn 1, live empty); a true id-less transient retries once, then the next provider" },
  { id = "PL12", task = "P.2", ported = "TestPL12_InsecurePluginFilesAreRefusedAndThePluginRunsNoNewPrivs", desc = "plugin: a setuid, setgid or security.capability plugin file is 78 at load; the bit set between load and spawn is 'insecure' at spawn with no exec; the plugin process runs with NoNewPrivs 1" },
  { id = "PT1", task = "P.2", ported = "TestPT1_HelloAndConfigureAnswerTheRequiredFields", desc = "protocol suite: hello answers protocol 1, the type, a plugin_version and all seven caps; configure answers endpoints, a non-empty arch and a max_name of at least 60; requests with unknown fields are answered" },
  { id = "PT2", task = "P.2", ported = "TestPT2_ConcurrentRequestsGetOneFinalEachAndUnknownMethodsAnError", desc = "protocol suite: concurrent requests with out-of-order ids get exactly one final frame each, every line is one JSON object, an unknown method is an error of an A.6 class, an unknown owner is empty and an unused prefix lists nothing" },
  { id = "PT3", task = "P.2", ported = "TestPT3_ALaunchedJobIsWatchedReadAndTornDown", desc = "protocol suite: launch answers the assigned name, watch streams the agent's markers and out events and ends with exit and began, only booting or lost phases appear, output serves a result whose MAC verifies under K, owner returns the job's tag, teardown is idempotent and list drops the resource" },
  { id = "PT4", task = "P.2", ported = "TestPT4_ACancelledWatchIsAnsweredPromptly", desc = "protocol suite: after a cancel request the open watch is answered within 5 seconds" },
  { id = "PT5", task = "P.2", ported = "TestPT5_ThePluginExitsWhenStdinCloses", desc = "protocol suite: the plugin exits within 2 seconds of stdin closing" },
  { id = "PT6", task = "P.2", ported = "TestPT6_SecretsAreInNoArgvOrEnvironment", desc = "protocol suite: no fd 3 secret is in the cmdline or environ of the plugin or its children, and BITC_SECRETS_FD=3 is set" },
  { id = "PT7", task = "P.2", ported = "TestPT7_ACancelledLaunchAfterCreateStillNamesTheResource", desc = "protocol suite: a launch cancelled while the created instance is still provisioning is answered with an error that carries the resource (an id, or pre_attach with the assigned name), never a bare transient" },
  { id = "PT8", task = "P.2", ported = "TestPT8_HelloDeclaresThePluginsOwnType", desc = "protocol suite: hello declares the plugin's own type whatever type bitc asked for, so a binary pinned under the wrong provider type is caught by core" },
  { id = "PX1", task = "P.2", ported = "TestPX1_ProviderSuiteOnReferencePlugin", desc = "the provider conformance suite (every scenario, PS1 and FB15 beside it) passes on the reference plugin bitc-provider-fakex against its fake API, with the scenario results of the compiled-in fake" },
  # SE: caller env per provider (bitc-only, providers delta S)
  { id = "SE1", task = "V.1", ported = "TestSE1_DefaultsSettingAndValidation", desc = "providers.<t>.send_env defaults to the provider's declaration (runpod forced; a fake from send_env_default, forwarded when unset; a multi_job type at most forwarded; a plugin forwarded, the stub plugin with and without hello multi_job), every value is settable and `config explain` shows the level with its source (default or host); a bad value, forced on a multi_job type (for a plugin: after hello, at config check and doctor --remote) and a repo-file key are 78; the repo-file 78 names providers.<t>.send_env: host-only key" },
  { id = "SE2", task = "V.1", ported = "TestSE2_NoneSendsNoCallerEnv", desc = "send_env = none: a job with any forwarded name set is ineligible for the provider with the exact none note and no call, reservation, ledger line or breaker record; a job with none set runs and its [remote] env values still cross" },
  { id = "SE3", task = "V.1", ported = "TestSE3_ForcedJobMovesToAForcedProvider", desc = "a job with a forced name is ineligible on a forwarded provider (exact note naming the forced names only, no call to it, no breaker record) and runs with both values on the next provider at forced; a plain-only job runs on the forwarded one; on_failure = stop ends 69 with the not-eligible line" },
  { id = "SE4", task = "V.1", ported = "TestSE4_ForwardedNeverStrips", desc = "a forwarded provider never gets a subset of a job's forwarded names: the job is ineligible there and the forced value (raw, hex, base64) appears in nothing the provider recorded; a plain-only job gets its plain value" },
  { id = "SE5", task = "V.1", ported = "TestSE5_MultiJobNeverGetsForcedNames", desc = "invariant: a multi_job provider defaults to forwarded even when it declares forced, a forced job is ineligible there, and no forced canary appears in anything it recorded" },
  # SP: Sprites provider (bitc-only, sprites-provider.md 8.2); S.1 is the client part of each row
  { id = "SP2", task = "S.1", ported = "TestSP2_OrgGuard", desc = "a token whose org slug differs from org is refused before any request and a Sprite response naming another organization is an unavailable error on create, get and list that names the Sprite so it can be deleted (client part); a wrong-organization create is deleted at once, writes one pause record and moves on, and the next job makes no create (provider part, S.2; the 78 at load is SP1)" },
  { id = "SP4", task = "S.1", ported = "TestSP4_CapacityIsTransient", desc = "429, sprite_creation_rate_limited, concurrent_sprite_limit_exceeded (any status) and max sprites per org exceeded are transient, create nothing and are neither unavailable nor a pre-attach discard (client part; the one retry, trying runpod and the missing breaker or pause record are in SP19)" },
  { id = "SP5", task = "S.1", ported = "TestSP5_AuthIsUnavailable", desc = "401 and 403 (account restricted) are unavailable on a create and on a get and create nothing (client part); the provider part (S.2): one pause record, the next provider, and no API call while paused" },
  { id = "SP8", task = "S.1", ported = "TestSP8_PoliciesBeforeExec", desc = "network and resources policies are set and read back before the first exec and the job policy is set and read back before the attach exec (call order); an exec out of order is refused before it is sent and a policy that reads back differently blocks every exec" },
  { id = "SP1", task = "S.2", ported = "TestSP1_SettingsDefaultsAndValidation", desc = "the sprites keys have the documented defaults (send_env forced), every validation case of the design's 7 is a 78 with its message (org, token slug, sizes, vcpu, memory_bound, explicit egress domains, disk_bound, warm-reuse keys unknown, fallback_until, send_env, a repo file, an insecure deploy_key_file)" },
  { id = "SP3", task = "S.2", ported = "TestSP3_PriceReachesTheLedger", desc = "the price per size comes from the rates with the memory at max(memory, memory_bound) and the disk bound (usd_per_hour only raises it); the ledger's launch estimate is price x (E - now) and the end line's cost_usd is price x minutes (the unit tests pin $0.757154/h at the 16 GiB bound and $0.569247/h at 8 GiB)" },
  { id = "SP6", task = "S.2", ported = "TestSP6_ProvisioningInfraFailureRetriesOnceThenMovesOn", desc = "a provisioning infra failure deletes the Sprite (204), retries once on a fresh Sprite with a new name and reservation, then trying runpod ...; <name> torn down before attach; one ledger launch and end fallback created=true per attempt; two breaker failures" },
  { id = "SP7", task = "S.2", ported = "TestSP7_AttachClassification", desc = "an exec upgrade refused with an HTTP error is pre-attach (deleted, retried once on a fresh Sprite); an upgrade that times out counts as attached (deleted, 75, RunPod and local never tried); an agent that refuses its payload is 75 at once with what it said" },
  { id = "SP9", task = "S.2", ported = "TestSP9_NoJobInputBeforeTheAttachExec", desc = "the call order is create, build and resources policies (each read back), the stub and provisioning execs, the job policy (read back), then the attach; no spec, code ref, key or forwarded value in any call or provisioning exec before the attach" },
  { id = "SP10", task = "S.2", ported = "TestSP10_SecretsTravelOnStdinOnly", desc = "the deploy key, K and the forwarded values appear in no URL, query, body, label, overlay file or automatic checkpoint; B is omitted and the spec's port is -1; only the attach's stdin carries them" },
  { id = "SP11", task = "S.2", ported = "TestSP11_KeepAliveAndColdDrop", desc = "the Task keeps a quiet command from pausing a Sprite even when an open exec session would not hold it (created, renewed, deleted at the end); a cold drop at the boot or mid-job is a lost job: 75, the Sprite deleted, a breaker failure after BEGIN" },
  { id = "SP12", task = "S.2", ported = "TestSP12_CapEstimateAndCountingOnce", desc = "the estimate example of the design's 5.2 (start 10m + timeout 30m: 55 minutes), the cap refusing at the per-host share with the exact note, and a running Sprite and its reservation counted once" },
  { id = "SP13", task = "S.2", ported = "TestSP13_InterruptDeletesTheSprite", desc = "a signal before the attach (during provisioning) or after it deletes the Sprite and exits 128+N, with no fallback, ledger end interrupted and no breaker record" },
  { id = "SP15", task = "S.2", ported = "TestSP15_ProvisioningRepoFailureIs69", desc = "a repo-class provisioning failure (a tool pin) exits 69 with the setup line: the Sprite is deleted, there is no retry, no fallback and no breaker record" },
  { id = "SP16", task = "S.2", ported = "TestSP16_AmbiguousCreate", desc = "create-then-500: found and deleted retries once then falls back; delete not confirmed is left for sweep with no retry and an orphan reservation the next launch's cap check deletes at once; with fallback_until = resource both are 75; a policy 5xx after the 201 takes the same path; a list 5xx before any create is retried once" },
  { id = "SP17", task = "S.2", ported = "TestSP17_ReadAndTailRejectBadArguments", desc = "read and tail through the Sprites exec path reject a bad job id, an unlisted file name and a symlink with nothing on stdout; a symlinked artifact archive is not fetched (75) and applies nothing" },
  { id = "SP18", task = "S.2", ported = "TestSP18_HostCompletesFromAnIdleSprite", desc = "the agent exits by itself after result.json; the host completes result.json, the output and the artifacts over exec, then deletes the Sprite; the attach payload has port -1 and no bearer" },
  { id = "SP19", task = "S.2", ported = "TestSP19_BreakerPausesSprites", desc = "three discarded Sprites within the window pause Sprites (sprites is paused: ...), the next job goes to RunPod without a create; 429s write no record" },
  { id = "SP20", task = "S.2", ported = "TestSP20_SendEnv", desc = "send_env defaults to forced and a forced value travels only in the attach's stdin; with forwarded a job forwarding a forced name is ineligible for Sprites (no call, no reservation, no ledger line) and runs on RunPod" },
  { id = "SP14", task = "S.3", ported = "TestSP14_SweepTable", desc = "the sweep table of the design's 2.4, every row: own past E; own with no reservation older than start_timeout (job process gone); own with a live reservation, own and young, another install's, and a forged tag kept; an orphan reservation with its pid alive deleted at once and dropped; another install's expired Sprite only with --foreign; a dry run deletes nothing; and the next launch's cap check deletes an orphan too" },
  { id = "SP21", task = "S.3", ported = "TestSP21_WorstCaseScriptSprites", desc = "scripts/live-proof-worst-case.sh --sprites prints 2 x provisioning + (start + timeout + 15 + sweep) minutes at the price, and the default mode is unchanged" },
  { id = "SP22", task = "S.4", ported = "TestSP22_ProviderSuiteOnSpritesFake", desc = "the provider conformance suite (launch, fallback, setup failure after attach, lost, cap, breaker, restart, interrupt, dropped tail, artifacts, sweep) passes on the Sprites fake, with the list completeness row PS1 beside it; a dropped log tail is re-read whole by offset, a forged result is refused (75) as on RunPod, and a repo setup failure is covered by the Sprites fake's own rows" },
  { id = "SP23", task = "S.4", ported = "TestSP23_FallbackChainSpritesRunPodLocal", desc = "pool providers = [sprites, runpod, local] on spritesfake and runpodfake: a pre-attach Sprites failure moves to RunPod, RunPod without capacity (the no-instances answer, no breaker record) moves to local, an attached Sprites failure is 75 and never moves on, a forced env value works on both, and the ledger and the daily cap are kept per provider" },

  # SH: ssh host (H.1)
  { id = "SH7", task = "H.1", ported = "TestSH7_JobsAreIsolatedAndLeaveNothingBehind", desc = "isolation (privileged): a slot-1 job cannot read slot 2's or the previous job's files, leaves no process, shares no /tmp, /var/tmp, /run/lock, /dev/shm or IPC, and cron, at and linger are denied or removed" },
  { id = "SH8", task = "H.1", ported = "TestSH8_CheckHostFailsOnEachItemAgainstAFakeProcTree", desc = "check-host fails on each of C.8 items 1-4 and 6-11 against a fake /proc and /sys tree (the kernel's binfmt path is /proc/sys/fs/binfmt_misc, only read), each with its own fail line; it only reads the cgroup tree (no directory, no controller write)" },
  { id = "SH11", task = "H.1", ported = "TestSH11_GateRejectsEveryMalformedVerbWith64AndEmptyStdout", desc = "the gate, run as the current user against a fake root, rejects every malformed verb or argument with 64 and empty stdout" },
  { id = "SH14", task = "H.1", ported = "TestSH14_SlotHandoffOwnerNonceAndLease", desc = "slot handoff (privileged): a second --prepare is refused while one is held, a stale nonce is refused, a lapsed lease can be taken" },
  { id = "SH15", task = "H.1", ported = "TestSH15_StaleTeardownIsGoneAndKillsNothing", desc = "teardown of a slot owned by another job prints gone and kills nothing (privileged)" },
  { id = "SH16", task = "H.1", ported = "TestSH16_ConcurrentJobsHaveSeparateNetworksAndNoLAN", desc = "network (privileged): concurrent jobs bind the same port in separate namespaces and reach neither each other, the VM nor the LAN; DNS works" },
  { id = "SH17", task = "H.1", ported = "TestSH17_ReachabilityKeyReadableBySlotUser", desc = "a reachability key readable by a slot user makes check-host fail ssh-reach-key (privileged)" },
  { id = "SH18", task = "H.1", ported = "TestSH18_GateWiringThroughSshdLoginAndSudo", desc = "gate wiring (privileged): the command reaches the gate through sshd, bitc-login and sudo; the setup script is idempotent, dry-runs and refuses non-root" },
  { id = "SH20", task = "H.1", ported = "TestSH20_NftTableRemovedFailsCheckHost", desc = "the nft table removed after a reboot makes the next check-host fail (privileged)" },
  { id = "SH22", task = "H.1", ported = "TestSH22_TunnelAccountCanOnlyListenOnItsOnePort", desc = "tunnel lockdown (privileged, real sshd): the tunnel account can only remote-listen on its one port" },
  { id = "SH23", task = "H.1", ported = "TestSH23_JobSeccompFilterDeniesVsockUserNamespacesAndKeyrings", desc = "seccomp (privileged): vsock, user namespaces and keyrings are denied to a job, normal programs work" },
  { id = "SH24", task = "H.1", ported = "TestSH24_NoIPv6AndDoctorProbesTheVMNamespace", desc = "LAN block, IPv6 (privileged): no global IPv6 from a slot uid; doctor item 5 runs in the right namespace" },
  { id = "SH25", task = "H.1", ported = "TestSH25_FirewallSelfTestDecisionsAndMarker", desc = "firewall self-test: any LAN-side target reached prints FIREWALL NOT ACTIVE, a required egress failing prints EGRESS BROKEN, either exits non-zero and writes a root-only marker; a pass removes it (injected probe results, no network); the VM's own sshd answering (namespace host end) counts as reached, so the test cannot pass vacuously; the gate checks the marker only after the whole boot line validates" },
  { id = "SH26", task = "H.1", ported = "TestSH26_SetupPrintEqualsTheManagedFilesText", desc = "the setup script's --print output equals the text the agent checks (sudoers, sshd, nft, host.conf, authorized keys) and the script carries the self-test, never writes sysctl and only reads ip_forward" },
  { id = "SH27", task = "H.1", ported = "TestSH27_SetupRequiresTheControllerAddress", desc = "the setup script and the firewall-selftest verb refuse a real run without the controller-facing LAN address (a mandatory self-test target), before anything changes" },
  { id = "SH28", task = "H.1", ported = "TestSH28_RunbookAndHeaderCoverNetnsFalseUndoAndAgentHash", desc = "the runbook covers the undo of forwarding, the --netns false mode, forwarding with policy accept and verifying the agent binary hash; the setup script header lists every path the self-test touches" },
  { id = "SH29", task = "H.1", ported = "TestSH29_AllowNeverChangesTheRuleset", desc = "--allow HOST:PORT (repeatable) on the setup script and firewall-selftest changes only which targets the self-test expects to reach: the ruleset is byte-identical with and without it, defaults stay github.com:22 and registry.npmjs.org:443, and literal private, loopback, link-local, CGNAT, 198.18/15 or IPv6 ULA targets are refused unless --allow-test-targets is given (host names and documentation ranges are accepted)" },

  # DOC: documentation (bitc-only)
  { id = "DOC1", task = "3.2", ported = "TestDOC1_QuickStartRuns", desc = "the README quick start runs as written" },
  { id = "DOC2", task = "3.2", ported = "TestDOC2_AgentGuideRuns", desc = "the agent guide's examples run as written" },
  { id = "DOC3", task = "3.2", ported = "TestDOC3_ExitCodesTableMatchesTheContract", desc = "the exit-code doc lists every bitc exit code" },
  # SH: ssh provider (H.2)
  { id = "SH1", task = "H.2", ported = "TestSH1_ConfigCasesAre78WithTheirMessages", desc = "the C.10 ssh config cases are 78 with the messages shown" },
  { id = "SH2", task = "H.2", ported = "TestSH2_PinnedArgvKnownHostsAndMismatchAgainstARealSSHD", desc = "the ssh argv is exactly C.2.2; known_hosts is the one `bitc-ssh <key>` line; a host key mismatch is ErrUnavailable (pause) and nothing is learned (the privileged half runs a real sshd; a stand-in client proves the same in make ci)" },
  { id = "SH3", task = "H.2", ported = "TestSH3_SlotsLowestFreeAllOrNoneAndBusy", desc = "slots: lowest free, all or none, max_live, busy is a fallback note, a host-side busy slot is transient" },
  { id = "SH4", task = "H.2", ported = "TestSH4_CostIsZeroByDefaultAndRailsStillRefuse", desc = "cost is $0 by default and only the daily_usd comparison is skipped; a List error, the breaker, launch.lock and max_live still refuse; usd_per_hour keeps a priced ledger" },
  { id = "SH5", task = "H.2", ported = "TestSH5_ArchMismatchAndPerArchEligibility", desc = "an arch mismatch is unavailable; a pool arch that excludes the host is an ineligible line; a tool with no arch entry is ineligible" },
  { id = "SH6", task = "H.2", ported = "TestSH6_PreResourceFailuresMoveOn", desc = "pre-resource failures (connect, probe, install, check-host) move on to the next provider; a prepare failure past session setup is pre-attach" },
  { id = "SH9", task = "H.2", ported = "TestSH9_PerJobValuesAndTheSendEnvCheck", desc = "per-job values stay out of argv and files; a forced forwarded name under send_env forwarded, or any forwarded name under none, is ineligible with no connect" },
  { id = "SH12", task = "H.2", ported = "TestSH12_TheRunPayloadIsOutAndTheLinkFails", desc = "after the --run payload is written and the connection drops, the slot is torn down by name, 75, and no next provider is tried" },
  { id = "SH13", task = "H.2", ported = "TestSH13_ARunThatNeverReachedTheHostIsPreAttach", desc = "a --run whose ssh exits 255 with one pre-session line is pre-attach: teardown by name, then retry or the next provider" },
  { id = "SH19", task = "H.2", ported = "TestSH19_ServicesAndRootStepsAreIneligible", desc = "a repo with services or root steps is ineligible for ssh with the C.5 note, and nothing connects" },
  { id = "SH21", task = "H.2", ported = "TestSH21_APrepareThatNeverGotPastSessionSetup", desc = "a prepare that never got past session setup is pre-resource: no teardown, no orphan, no breaker record, the slot lock is free once the walk moves on; an unreachable on-demand host never trips the breaker; a host key mismatch pauses" },
  { id = "SH10", task = "H.3", ported = "TestSH10_SweepTagVerifiedRuleWithOrphans", desc = "sweep frees an own slot group past E, one with no reservation older than start_timeout, and one whose only reservation is an orphan at once (the next launch's cap check too); a live non-orphan reservation keeps it; a tag that does not verify is kept before E and freed after E only with --foreign" },
  { id = "SH30", task = "H.3", ported = "TestSH30_DoctorRemoteSSHLinesFromTheHostAndTheController", desc = "doctor --remote on ssh prints the pinned host key fingerprint, relays every check-host --doctor line as the host prints it (a fail exits 69), says why an unreachable host or an arch mismatch fails, warns when no sweep ran in 30 minutes, and checks the tunnel account with sshd -T (warn without root)" },
  { id = "SH31", task = "H.3", ported = "TestSH31_StatusSlotsSectionForSSH", desc = "status --json shows the ssh provider's slots: total, busy, free and the held groups (any controller's, own or not), and lists own and foreign groups" },
  { id = "SH32", task = "H.3", ported = "TestSH32_ProviderSuiteOnSSHFake", desc = "the provider conformance suite (launch, fallback, setup failure after attach, repo setup failure, lost, cap, breaker, restart, interrupt, dropped tail, forged result, artifacts, sweep) passes on the ssh provider against the sshfake host" },
  { id = "SH33", task = "H.1c", ported = "TestSH33_OwnersCaseIsCleanedAndASecondRunIsOk", desc = "after the unmount, setup removes exactly the known OrbStack leftovers (the guest resolv.conf file, the /mnt/linux link, the empty placeholder directories) with rmdir and rm of exact paths, replaces a /etc/resolv.conf link into the guest share atomically and only when its target is a regular file, never follows a link, keeps the old link texts, is idempotent and changes nothing with --dry-run" },
  { id = "SH34", task = "H.5", ported = "TestSH34_ConfigKindsUploadIsSSHOnlyAndMaxBundleBounds", desc = "[providers.ssh] transport = { kind, max_bundle }: kind is git-push (default) or upload and upload is valid on ssh only, max_bundle is at most 8GiB, an upload job needs no clone_url, deploy key or forge remote, and doctor --remote prints the transport and judges the host's git (>= 2.45.1 or a changelog naming CVE-2024-32002) from the ssh-git-version and ssh-git-changelog items that check-host --doctor relays" },
  { id = "SH35", task = "H.5", ported = "TestSH35_ThePayloadHasCodeNoKeyAndTheBytesFollowTheFrame", desc = "upload, controller side: the job's temporary ref exists only while git bundles it and is gone after success, failure and a cancelled context, a bundle over max_bundle is ineligible and creates nothing, the payload carries code {kind, len, sha256, ref} and no deploy key with exactly len bytes after the frame, and the core pushes nothing" },
  { id = "SH36", task = "H.5", ported = "TestSH36_PayloadIsValidatedBeforeAByteIsRead", desc = "upload, root side, on a fake slot tree with injected statfs, clock and race hook: the code field is validated with the frame only (kind, 0 < len <= the host cap, sha256 form, ref of this job) before any bundle byte is read; max_bundle is an optional host.conf key (1 GiB default); under the host-wide upload.lock the space is checked (3 x len + 1 GiB), the slot is killed and the bundle is written fd-relative (stale or linked entries never followed, a swapped dir is refused as upload dir raced, 0750/0640 root:slot group) with exactly len bytes, a 30 s idle and an overall deadline; a short stream, a stall, a hash mismatch, a full disk and a stage-2 start failure all leave no .bitc-upload, and slot clean removes a stale one" },
  { id = "SH37", task = "H.5", ported = "TestSH37_ABundleThatFailsVerifyIsACodeFailure", desc = "upload, stage 2, with real git on a local bundle: git runs as the job user through the step path with a cleared env and --end-of-options; a bundle that fails verify, a tip that is not the sha, an oversize checkout, an inode bomb and .git or .. tree entries (explicit git fsck) each fail the code step and leave neither .bitc-upload nor a partial work dir; the bundle is gone before the first setup step; LFS filters and submodules stay inert under a hostile system git config; the root agent never buffers git's output (ls-tree is parsed as a stream with saturating totals and git is killed at the limit, so a fan-out tree is refused, stderr keeps only its last 64 KiB)" },
  { id = "SH38", task = "H.5", ported = "TestSH38_AnUploadJobWithNoCloneURLRunsOnTheFakeHostAndItsOutputArrives", desc = "ssh upload end to end on the sshfake host: an upload job with no clone_url and no remote runs through the controller, the fake saves exactly the bundle bytes the payload announces, the agent checks the commit out and the job output arrives" },

  # WF: workflow lint (bitc-only; ported from crewkit tools/check-workflows.py)
  { id = "WF1", task = "3.3", ported = "TestWF1_RunsOnMustBeAGitHubHostedLabel", desc = "every runs-on is a GitHub-hosted label (ubuntu-*, macos-*, windows-*): a self-hosted or custom label in a scalar, flow list, block list or matrix value (include entries too) fails, a runner group (block or inline) fails, and an expression other than a resolvable matrix.X is refused" },
  { id = "WF2", task = "3.3", ported = "TestWF2_NoPullRequestTargetTrigger", desc = "a pull_request_target trigger fails in the block, flow list and scalar on: forms; the word in a run line or a comment is fine" },
  { id = "WF3", task = "3.3", ported = "TestWF3_UsesPinnedToAFullCommitSHA", desc = "every uses: (steps and reusable workflows) is pinned to a full 40-hex commit SHA; a tag, branch or short SHA fails; local ./ actions are fine; a docker:// image needs an @sha256 digest" },
  { id = "WF4", task = "3.3", ported = "TestWF4_FindingsNameFileAndLine", desc = "each workflow lint finding is reported as file:line: message" },
  { id = "WF5", task = "3.3", ported = "TestWF5_TheRepoWorkflowsPass", desc = "the lint scans .github/workflows/*.yml and *.yaml, an empty directory is an error, and this repo's workflows (privileged.yml included) pass" },

