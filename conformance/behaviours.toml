  { id = "PUB1", task = "3.3", ported = "TestPUB1_ContributorFilesExist", desc = "the contributor files exist: CONTRIBUTING (build, register rule, secrets), SECURITY, two issue forms, a pull request template" },
  { id = "PUB5", task = "3.3", ported = "TestPUB5_SecretsSummaryNeverPrintsTheSecret", desc = "make secrets prints the finding count and rule, file and commit per finding, never the match or the secret" },
  { id = "PUB6", task = "3.3", ported = "TestPUB6_SecretsExitCodesFailClosed", desc = "make secrets exits 0 when clean, 1 on findings and 2 on a scanner error, a missing or unreadable report" },
  { id = "PUB7", task = "3.3", ported = "TestPUB7_SecretsExtraPassUsesTheExtraConfig", desc = "with GITLEAKS_EXTRA set make secrets runs a second pass with that config; an unreadable file is a scanner error" },
  { id = "PUB8", task = "3.3", ported = "TestPUB8_GitleaksWiring", desc = "make tools pins gitleaks, .gitleaks.toml extends the defaults, dev.sh mounts GITLEAKS_EXTRA, make ci does not run secrets" },
