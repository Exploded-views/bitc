# Behaviour register (spec 11). One row per behaviour ID with exactly one of:
#   todo = true | ported = "<Test>" | changed = "<changes.toml key>", test = "<Test>" | dropped = "<reason>"
# Rows are grouped by family; a task edits only its own rows.
rows = [
  # P: invocation, pool names, configuration
  { id = "P1", task = "1.1", ported = "TestP1_ExitCodePassThrough", desc = "a command run under a pool returns its own exit code (128+N when killed by signal N)" },
  { id = "P2", task = "1.7", ported = "TestP2_UsageWithoutPoolOrCommand", desc = "a run with no pool or no command prints usage, exits 64 and creates no state" },
  { id = "P3", task = "1.7", ported = "TestP3_InvalidPoolNames", desc = "a pool name outside [A-Za-z0-9_-]+ exits 64 with 'invalid pool name' before anything is created or run" },
  { id = "P4", task = "1.7", ported = "TestP4_DashAndUnderscoreAreOnePool", desc = "'-' and '_' spell the same pool everywhere: locks, history, settings" },
  { id = "P5", task = "1.7", changed = "unknown-pools", test = "TestP5_UnknownPoolsRefusedUnlessDefault", desc = "an unknown pool is refused with 64; unknown_pools = \"default\" gives it one slot and the default wait" },
  { id = "P6", task = "1.3", ported = "TestP6_PoolsAreIndependent", desc = "pools are independent: a held slot in one never blocks another except through a shared group" },
  { id = "P7", task = "1.2b", ported = "TestP7_HostWinsOverRepoKeyByKey", desc = "for project keys the host file wins over the repo file key by key" },
  { id = "P8", task = "1.2b", ported = "TestP8_EnvCannotChangeCapacities", desc = "the caller's environment cannot change capacities, floors or providers; only the documented BITC_* overrides apply" },
  { id = "P9", task = "1.2b", changed = "config-78", test = "TestP9_WholeFileValidatedAtLoad", desc = "per-pool settings come from the host file and every file is validated whole at load" },
  { id = "P10", task = "1.1", dropped = "the reference shipped per-host pool sizes; bitc ships no pools, only example configs", desc = "shipped pool sizes for one host" },

  # S: slots and locking
  { id = "S1", task = "1.3", ported = "TestS1_OneSlotNeverOverlapsTwoSlotsDo", desc = "slot i of N is a lock tried lowest first; a one-slot pool never overlaps two commands, a two-slot pool does" },
  { id = "S2", task = "1.3", ported = "TestS2_SlotReleasedWhateverTheCode", desc = "the slot is released when the command ends, whatever its exit code" },
  { id = "S3", task = "1.5a", changed = "stragglers", test = "TestS3_BackgroundedChildNeverKeepsTheSlot", desc = "a backgrounded descendant never keeps the slot held: stragglers in the hold's group are terminated at its end" },
  { id = "S4", task = "1.3", ported = "TestS4_WaiterLeaksNoFds", desc = "a waiter leaks no file descriptors while it polls" },
  { id = "S5", task = "1.3", ported = "TestS5_WaiterGetsSlotOnRelease", desc = "a waiter gets the slot once the holder releases it" },
  { id = "S6", task = "1.3", ported = "TestS6_LeftoverLockFilesDoNotBlock", desc = "leftover lock files from dead processes never block admission" },
  { id = "S7", task = "1.7", ported = "TestS7_BitcStaysTheParentAndHistoryNamesIt", desc = "bitc stays the command's parent for the whole hold; history and the ticket name bitc's pid" },

  # T: waiting, deadline, STARVED
  { id = "T1", task = "1.3", ported = "TestT1_StarvedAfterWait", desc = "no slot within the pool's wait: STARVED <pool> on stderr, exit 75, the command never runs" },
  { id = "T2", task = "1.4", ported = "TestT2_ReasonRecomputedEveryAttempt", desc = "the STARVED reason is recomputed every attempt, so a reason that no longer applies never survives" },
  { id = "T3", task = "1.3", ported = "TestT3_PollDefaultEnvOverrideAndDeadline", desc = "the poll interval defaults to 5s, BITC_POLL overrides it (>= 100ms), and the deadline is start + wait" },
  { id = "T4", task = "1.3", ported = "TestT4_WaitZeroIsOneAttempt", desc = "wait = \"0s\" makes exactly one attempt" },
  { id = "T5", task = "1.3", changed = "starved-wording", test = "TestT5_FIFOWithinClass", desc = "waiters of one class are admitted in arrival order" },

  # R: priority lane
  { id = "R1", task = "1.3", ported = "TestR1_LiteralSubstringNeverGlob", desc = "a caller is high priority when a high_cwd_contains entry is a literal substring of its logical or canonical cwd (never a glob)" },
  { id = "R2", task = "1.3", ported = "TestR2_HighTicketWhileWaitingAndRunningThenGone", desc = "a high caller's ticket is visible while it waits and runs and disappears when it ends, success or failure" },
  { id = "R3", task = "1.3", ported = "TestR3_NormalWaitsBehindHighHighsDoNotBlock", desc = "a normal caller waits while the pool has a live high ticket and starves with (priority lane); high callers do not block each other" },
  { id = "R4", task = "1.3", ported = "TestR4_DeadTicketsPrunedPriorityPerPool", desc = "tickets of dead owners are pruned on sight; priority is per pool" },
  { id = "R5", task = "1.3", ported = "TestR5_OutsideFragmentsQueuesBehindHigh", desc = "a caller outside every high entry is normal and still queues behind a live high ticket" },
  { id = "R6", task = "1.3", ported = "TestR6_PriorityIsPerPoolNotPerGroup", desc = "priority is per pool, never per group: a high waiter of one pool does not stop another pool taking a shared group" },

  # H: history
  { id = "H1", task = "1.7", ported = "TestH1_HistoryLineFields", desc = "every admitted command appends one history.jsonl line: UTC time, pool, slot, pid and the argv as an array" },
  { id = "H2", task = "1.1", dropped = "the reference created an empty history file on every call; nothing depends on it", desc = "history file created on every call" },
  { id = "H3", task = "1.7", ported = "TestH3_RefusalsWriteNoHistory", desc = "refused calls write no history line" },
  { id = "H4", task = "2.6a", ported = "TestH4_RemoteHistoryNamesResourceAndCommit", desc = "a remote job writes a history line naming the provider resource and the commit" },

  # D: state dir
  { id = "D1", task = "1.2b", changed = "state-dir", test = "TestD1_StateDirResolution", desc = "the state dir is --state-dir, BITC_DIR, host.state_dir or $XDG_STATE_HOME/bitc (~/.local/state/bitc); empty values count as unset" },
  { id = "D2", task = "1.2b", ported = "TestD2_RelativeBitcDirIsAbsolute", desc = "every session of the account resolves the same default state dir; a relative BITC_DIR is made absolute against the cwd" },
  { id = "D3", task = "1.1", ported = "TestD3_StateDirMustBePrivate", desc = "a state dir that is group- or world-accessible, not owned by the user or on NFS is refused with 78" },

  # M: groups (cross-pool semaphores) and nested holds
  { id = "M1", task = "1.3", ported = "TestM1_GroupKeepsConsumersApart", desc = "pools listing a group take its units for the whole command, so two consumers never overlap beyond its capacity; other pools are not held back" },
  { id = "M2", task = "1.3", changed = "starved-wording", test = "TestM2_NoHoldAndWait", desc = "no hold-and-wait: a busy group releases the slot taken in the same attempt and the caller starves with (group <g> busy)" },
  { id = "M3", task = "1.3", ported = "TestM3_GroupMembershipUsesCanonicalNames", desc = "group membership uses canonical pool names ('-' and '_' are the same)" },
  { id = "M4", task = "1.2b", changed = "config-78", test = "TestM4_GroupsAndFloorHostOnly", desc = "group capacities and the memory floor come only from the host file; the environment cannot change them" },
  { id = "M5", task = "1.7", ported = "TestM5_HoldExportsAVerifiableToken", desc = "a hold exports BITC_HOLD so a nested bitc call can prove it runs inside it" },
  { id = "M6", task = "1.3", ported = "TestM6_NestedCallSkipsParentsGroup", desc = "a nested call verified inside a hold skips the group units its parent holds and the memory floor, through shells and non-leader holders" },
  { id = "M7", task = "1.3", ported = "TestM7_ForgedClaimsNotBelieved", desc = "made-up, stale, unheld, reused-pid, sibling, orphaned or path-traversal hold claims are not believed" },
  { id = "M8", task = "1.8", ported = "TestM8_DetachedJobInsideAHoldTakesItsOwnUnits", desc = "a detached job started inside a hold clears BITC_HOLD and takes its own units" },
  { id = "M9", task = "1.7", ported = "TestM9_GroupIsNotAPool", desc = "a group name used as a pool exits 64 and runs nothing" },
  { id = "M10", task = "1.1", dropped = "documentation of reference holes that bitc's tickets, straggler kill and unknown-pool refusal close", desc = "known limits of the reference group lock" },

  # AD: admission (bitc-only)
  { id = "AD1", task = "1.3", ported = "TestAD1_TwentyWaitersFIFO", desc = "twenty waiters on a one-slot pool are each admitted once, in order, leaving no tickets" },
  { id = "AD2", task = "1.3", ported = "TestAD2_SigkilledHolderAndWaiterLeaveNoStuckPool", desc = "a SIGKILLed holder or waiter never blocks the pool: the next caller reaps the dead hold's group and is admitted" },
  { id = "AD3", task = "1.3", ported = "TestAD3_SamePoolNestedChildOneAtATime", desc = "a hold admits one nested child of its own pool at a time; another waits as (nested child busy)" },
  { id = "AD4", task = "1.3", ported = "TestAD4_InotifyWakesBeforeThePoll", desc = "a waiter wakes on a released ticket before its poll interval" },
  { id = "AD5", task = "1.3", ported = "TestAD5_CommandInheritsNoLockFds", desc = "lock and ticket fds are close-on-exec: the command inherits none" },

  # F: memory floor
  { id = "F1", task = "1.4", ported = "TestF1_FloorAdmitsAtExactlyTheFloor", desc = "a pool with memory starts only when available memory minus recent reservations is at least the floor; exactly the floor admits" },
  { id = "F2", task = "1.4", changed = "starved-wording", test = "TestF2_WaitsHoldingNothingAndStarvesWithTheMemoryReason", desc = "a pool under the floor waits holding nothing and starves with (memory: <n> MiB available, floor <f> MiB)" },
  { id = "F3", task = "1.4", changed = "config-78", test = "TestF3_FloorFromHostOnlyZeroDisablesEmptyIsError", desc = "the floor comes from the host file; \"0GiB\" disables it; the environment cannot change it" },
  { id = "F4", task = "1.4", ported = "TestF4_UnreadableMeminfoAdmitsWithOneWarning", desc = "unreadable meminfo admits with one warning per call, never per poll" },
  { id = "F5", task = "1.4", ported = "TestF5_NoMemoryPoolsAndNestedCallsSkipTheFloor", desc = "pools without memory never check the floor; a verified nested call skips it" },
  { id = "F6", task = "1.2b", ported = "TestF6_TestSeamNeedsLoopbackProviders", desc = "the procfs test seam is honoured only from a [test] table with loopback-only provider endpoints" },
  # MR: memory (bitc-only)
  { id = "MR1", task = "1.4", ported = "TestMR1_CgroupHeadroomAndReservations", desc = "available memory is the tighter of MemAvailable and cgroup headroom, minus reservations within reservation_window" },

  # E: environment exported to the command
  { id = "E1", task = "1.5b", ported = "TestE1_PoolEnvSetsAndUnsets", desc = "pool env sets variables (replacing inherited values) and env_unset removes them" },
  { id = "E2", task = "1.5b", ported = "TestE2_PoolEnvOverridesDefaults", desc = "a pool's env overrides the [defaults] env for the same key" },
  { id = "E3", task = "1.1", dropped = "a contract between the reference project's own scripts and its pool, not pool behaviour", desc = "repo scripts read a heap variable" },
  { id = "E4", task = "1.5b", ported = "TestE4_DefaultsEnvReachesEveryPool", desc = "[defaults] env reaches every pool" },

  # N: numeric validation
  { id = "N1", task = "1.2b", changed = "config-78", test = "TestN1_StrictIntegersAndDurations", desc = "integers accept 0 or [1-9][0-9]* only: a leading zero, sign, unit or fraction is refused with the file, key and quoted value before any lock" },
  { id = "N2", task = "1.2b", ported = "TestN2_UnitsAtLeastOneFloorZeroLegal", desc = "group units must be >= 1; a memory floor of 0 is legal" },
  { id = "N3", task = "1.2b", changed = "config-78", test = "TestN3_UnsetTemplateVariableRefused", desc = "a template using an unset variable is refused at load instead of running with a broken value" },
  { id = "N4", task = "1.2b", changed = "config-78", test = "TestN4_NonIntegerArithmeticRefused", desc = "a template doing arithmetic on a variable that is not an integer is refused at load" },

  # L: refuse rules and the argv unwrapper
  { id = "L1", task = "1.7", ported = "TestL1_RefusedBeforeAnyLockWithTheReason", desc = "a refused command exits 64 before any lock with the rule's reason and writes no history" },
  { id = "L2", task = "1.6", ported = "TestL2_RepoWideToolsScriptsAndAlwaysToolsRefused", desc = "repo-wide tool runs, listed npm scripts and an always-refused tool (except its listed args) are refused" },
  { id = "L3", task = "1.6", ported = "TestL3_UnwrapperSeesThroughWrappersAndShells", desc = "the unwrapper sees through VAR= prefixes, wrapper commands with option values, sh -c strings, npx/npm exec/pnpm dlx and node <script>, ignoring redirections" },
  { id = "L4", task = "1.6", ported = "TestL4_FilesDeeperDirsAndOtherToolsAllowed", desc = "files, deeper directories, version and help flags, other tools and command substitutions are allowed" },
  { id = "L5", task = "1.1", dropped = "documentation of reference classifier holes; bitc parses sh -c strings with a real parser", desc = "known classifier holes" },
  { id = "L6", task = "1.6", ported = "TestL6_SkippedOptionValuesAreNotPaths", desc = "values of options listed in skip_option_values are not path arguments" },

  # CL: classifier (bitc-only)
  { id = "CL1", task = "1.6", ported = "TestCL1_UnparsableShellStringIsNotRefused", desc = "an unparsable sh -c string whose leading simple command matches no rule is not refused (debug note only); its later commands are not checked" },
  { id = "CL2", task = "1.6", ported = "TestCL2_LinkedWorktreeNestedInACheckoutIsItsOwnRoot", desc = "the classifier compares paths with the git work-tree root: a linked worktree nested in a checkout is its own root, a symlinked work tree is compared by its physical path, a mode-0 top-level directory is still repo-wide (reference 402d260d, rows around B:2132 and B:2200)" },
  { id = "CL3", task = "1.12", ported = "TestCL3_UnparsableStringStillChecksItsLeadingCommand", desc = "an unparsable sh -c or env -S string whose leading simple command (the words before the first unquoted operator or redirection, unwrapped like an argv) matches a refuse rule is refused, e.g. a lint call followed by a here-document that is never closed" },

  # X: templated per-slot environment
  { id = "X1", task = "1.5b", ported = "TestX1_TemplatesExpandPerSlot", desc = "env templates expand per slot, e.g. a port of base + slot" },
  { id = "X2", task = "1.7", ported = "TestX2_SlotsExpandDifferentlyFixedTemplatesDoNot", desc = "slot 1 and slot 2 of one pool get different expansions; a pool whose template has no {slot} gets the same value on every slot" },
  { id = "X3", task = "1.5b", ported = "TestX3_VarsComeFromConfigHostWins", desc = "template variables come from [vars] in the config files" },
  { id = "X4", task = "1.5b", ported = "TestX4_InheritedValuesDoNotSurviveIntoAPoolsKeys", desc = "inherited values of a pool's env keys do not survive into a nested pool's command" },
  { id = "X5", task = "1.1", dropped = "the reference documented creating per-slot containers by hand; outside the pool", desc = "per-slot containers created by hand" },

  # Y: env hook, signals, hold token
  { id = "Y1", task = "1.5b", ported = "TestY1_EnvHookOutputExported", desc = "an env hook's parsed KEY=VALUE output is exported to the command" },
  { id = "Y2", task = "1.5b", ported = "TestY2_EnvUnsetRemovesInherited", desc = "env_unset removes inherited variables a pool must not see" },
  { id = "Y3", task = "1.5b", ported = "TestY3_HookRefusalIs64BeforeTheCommand", desc = "a hook exit listed in refuse_exit is 64 with the hook's first stderr line, before the command runs" },
  { id = "Y4", task = "1.5b", ported = "TestY4_HookThatCannotStartIs69", desc = "a hook that cannot start is 69 and the command does not run" },
  { id = "Y5", task = "1.5b", ported = "TestY5_EnvDefaultCallerWinsHostEnvForces", desc = "env_default applies only when the caller has not set the key; host env still forces a value" },
  { id = "Y6", task = "1.5b", ported = "TestY6_HoldTokenUniqueAndStateDirAbsolute", desc = "{hold} is unique per hold and {state_dir} is absolute; pools that do not use them export neither" },
  { id = "Y7", task = "1.5a", ported = "TestY7_ForwardAndWaitKeepsTheHoldUntilCleanup", desc = "on_signal = \"forward-and-wait\" forwards a signal and keeps the hold until the command's own cleanup ends; terminate pools end at once" },
  { id = "Y8", task = "1.5b", ported = "TestY8_PoolKeysDoNotLeakIntoOtherPools", desc = "a pool's env keys never leak into other pools' commands" },

  # J: detached jobs and wait
  { id = "J1", task = "1.8", ported = "TestJ1_StartedLineAndLogHoldsBothStreams", desc = "run --detach prints exactly 'started <name> pid <pid> log <abs path>' and the job's stdout and stderr go to the log" },
  { id = "J2", task = "1.8", ported = "TestJ2_ExitLineOnItsOwnLine", desc = "the log always ends with '__EXIT__ <code>' on its own line, also after no final newline, a CR or a NUL" },
  { id = "J3", task = "1.8", ported = "TestJ3_JobNames", desc = "a job name outside [A-Za-z0-9._-]+ exits 64 and creates nothing" },
  { id = "J4", task = "1.8", changed = "detached-logs", test = "TestJ4_LogExistsBeforeStartedAndUncreatableLogIs64", desc = "the log exists before 'started' is printed; an uncreatable log exits 64 without 'started'" },
  { id = "J5", task = "1.8", ported = "TestJ5_RerunNeverReportsTheFirstJobsCode", desc = "a rerun of a name starts a fresh generation; the superseded job never writes into it and its code is never reported as the rerun's" },
  { id = "J6", task = "1.8", ported = "TestJ6_OwnSessionSurvivesHangup", desc = "a detached job leads its own session and survives SIGHUP and the death of the caller's process group" },
  { id = "J7", task = "1.8", ported = "TestJ7_UsesTheCallersStateDirAbsolute", desc = "a detached job uses the caller's state dir, made absolute" },
  { id = "J8", task = "1.8", ported = "TestJ8_WaitLogTakesTheLastExitLineAtLineStart", desc = "wait --log takes the last line starting '__EXIT__ ' (start of line, log read as text even with NULs)" },
  { id = "J9", task = "1.8", changed = "wait-exit", test = "TestJ9_WaitOutcomes", desc = "wait prints RESULT exit/starved/internal error with the last 60 lines, RUNNING with 5 lines and 124, NO LOG and 66" },
  { id = "J10", task = "1.1", dropped = "bitc uses syscalls, not external flock or setsid tools", desc = "missing external tools exit 69" },

  # DJ: detached jobs (bitc-only)
  { id = "DJ1", task = "1.8", ported = "TestDJ1_ExitJobReturnsTheJobsCode", desc = "wait --exit job returns the job's own code" },
  { id = "DJ2", task = "1.8", ported = "TestDJ2_LogsTailAndFollow", desc = "logs prints, tails and follows a job's log until its exit line" },
  { id = "DJ3", task = "1.8", ported = "TestDJ3_CancelTerminates", desc = "cancel signals the supervisor, which applies on_signal; a cancel during the supervisor's startup is 143, not lost; an unknown job is 66" },
  { id = "DJ4", task = "1.8", ported = "TestDJ4_LostSupervisorIsStarved", desc = "a supervisor that died without result.json is lost: RESULT starved, 75" },
  { id = "DJ5", task = "1.8", ported = "TestDJ5_PreRunOfADetachedJobRunsAfterStarted", desc = "a detached job's pre_run runs in the supervisor, after started" },
  { id = "DJ6", task = "1.8", ported = "TestDJ6_SecondCancelOrKillEscalates", desc = "on a forward-and-wait job, one cancel waits; a second cancel or cancel --kill escalates to terminate (143)" },
  { id = "DJ7", task = "1.8", ported = "TestDJ7_FollowReturnsWhenTheSupervisorIsLost", desc = "logs -f returns 75 when the supervisor died without an exit line, never polls forever" },
  { id = "DJ8", task = "1.8", ported = "TestDJ8_DetachedResultReasonIsRedacted", desc = "a detached job's result.json and --result reason are redacted" },
  { id = "DJ9", task = "1.8", ported = "TestDJ9_LogsOfADetachFailedOnItsLogReturns", desc = "logs (-f) of a job whose detach failed on its log returns 66 with an error, never polls forever" },
  { id = "DJ10", task = "1.8", ported = "TestDJ10_CancelDuringPostRunKeepsTheCommandsCode", desc = "a cancel (or two) while post_run runs cuts the hook short and the job still ends with the command's own code and result" },
  { id = "DJ11", task = "1.8", ported = "TestDJ11_WaiterBoundToASupersededGenerationGetsItsOwnResult", desc = "a waiter bound to generation 1 across a rerun gets generation 1's real result and log tail" },

  # G: host sampler (dropped)
  { id = "G1", task = "1.1", changed = "sampler-dropped", desc = "CSV host samples" },
  { id = "G2", task = "1.1", changed = "sampler-dropped", desc = "sampler counts held locks only" },
  { id = "G3", task = "1.1", changed = "sampler-dropped", desc = "sampler GiB rounding" },
  { id = "G4", task = "1.1", changed = "sampler-dropped", desc = "sampler uses the pool's state dir" },
  { id = "G5", task = "1.1", changed = "sampler-dropped", desc = "sampler does not see remote jobs" },

  # Z: platform
  { id = "Z1", task = "1.9", ported = "TestZ1_LinuxAndADarwinClientOnly", desc = "bitc runs on Linux, and on macOS as a client build that refuses the Linux-only features; elsewhere it exits 69 and creates nothing" },
  { id = "Z4", task = "3.1", ported = "TestZ4_ClientCrossBuildsForDarwin", desc = "cmd/bitc cross-compiles with cgo off to a Mach-O executable for darwin/arm64 and darwin/amd64" },
  { id = "Z5", task = "3.1", ported = "TestZ5_CISmokesTheDarwinClient", desc = "ci.yml cross-builds the darwin client in the ci job and runs a macos-smoke job on macos-latest (build, version, a one-slot run of true, status --json) read-only, without persisted credentials, within 15 minutes, with the ci job's pins and Go version" },
  { id = "Z2", task = "1.1", dropped = "one binary: no script self-location", desc = "scripts find their own directory under CDPATH" },
  { id = "Z3", task = "1.1", dropped = "harness detail of the reference suite", desc = "suites skip without their tools" },

  # ST: status, sweep, doctor, version (bitc-only)
  { id = "ST1", task = "1.9", ported = "TestST1_StatusShowsHoldersWaitersGroupsMemory", desc = "status shows holders, waiters, groups, memory and the last STARVED reason" },
  { id = "ST2", task = "1.9", ported = "TestST2_StatusJSONMatchesTheSchema", desc = "status --json matches docs/status.schema.json" },
  { id = "ST3", task = "1.9", ported = "TestST3_SweepPrunesDeadTicketsAndMarksLostJobs", desc = "sweep prunes dead tickets, kills dead holds' process groups (history reaped) and marks dead supervisors' records lost and ended" },
  { id = "ST4", task = "1.9", ported = "TestST4_SweepRotatesHistoryKeepingThree", desc = "sweep rotates history.jsonl at history_max, keeping the three newest old files in order" },
  { id = "ST5", task = "1.9", ported = "TestST5_SweepDryRunChangesNothing", desc = "sweep --dry-run reports and changes nothing" },
  { id = "ST6", task = "1.9", ported = "TestST6_DoctorChecksAndExitCodes", desc = "doctor prints ok/warn/fail lines; 69 on a fail, 78 on config" },
  { id = "ST7", task = "1.9", ported = "TestST7_VersionTextAndJSON", desc = "version prints version, commit, schema versions and the release stamp; --json too" },
  { id = "ST8", task = "1.9", ported = "TestST8_AdminArgumentsAreChecked", desc = "status takes [--json] [POOL...], doctor [--remote], sweep's flags; anything else is 64 with a usage line" },
  { id = "ST9", task = "1.9", ported = "TestST9_StatusRedactsSecretsInArgvCwdAndReason", desc = "status, status --json and doctor redact configured credentials in holders' argv, cwd, job and reasons (spec 10)" },
  { id = "ST10", task = "2.7", ported = "TestST10_SweepRemovesStaleStagingDirs", desc = "sweep removes artifact staging dirs (<wt>/.bitc/staging/<job>) older than 6h in the current work tree and in the work trees of remote jobs in history; --dry-run only reports them" },

  # Q: remote dispatch and opt-in
  { id = "Q1", task = "2.1a", ported = "TestQ1_LocalByDefaultEnvCannotEnable", desc = "every pool is local by default; the environment cannot enable a provider" },
  { id = "Q2", task = "2.1a", ported = "TestQ2_RemoteProviderRunsBeforeLocalAdmission", desc = "a pool listing a remote provider walks to it after validation and refusals, before any local admission" },
  { id = "Q3", task = "2.1a", ported = "TestQ3_ForcedLocalNestedOrUnmatchedStaySilent", desc = "BITC_PROVIDER=local, --local, a nested call or a work tree outside remote_limits.worktrees stay local silently" },
