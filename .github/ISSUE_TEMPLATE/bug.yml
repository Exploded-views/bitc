name: Bug report
description: Something bitc did that it should not have, or did not do
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first. For a security problem, do not
        use this form: see SECURITY.md.
  - type: textarea
    id: version
    attributes:
      label: Output of `bitc version --json`
      render: json
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The full `bitc` command line.
      render: sh
    validations: { required: true }
  - type: input
    id: exit
    attributes:
      label: Exit code
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bitc doctor`
      render: text
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The parts of the host and repository config that matter. Remove credentials first.
      render: toml
    validations: { required: false }
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: Include the stderr lines bitc printed.
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: OS, kernel and architecture
      placeholder: Ubuntu 24.04, 6.8.0, amd64
    validations: { required: false }
