name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first. For a security problem, do not
        use this form: see SECURITY.md. If bitc works but slowed you down, use the friction form.
  - type: input
    id: version
    attributes:
      label: bitc version
      description: The output of `bitc version`.
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04 amd64, or macOS 15 arm64
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The full `bitc` command line.
      render: shell
    validations: { required: true }
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what the docs say
      description: What bitc did, and what the documentation says it should do. Link the page if you can.
    validations: { required: true }
  - type: input
    id: exit
    attributes:
      label: Exit code
    validations: { required: false }
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: The stderr and stdout lines that matter. Redact host names, tokens and paths first.
      render: text
    validations: { required: false }
  - type: textarea
    id: config
    attributes:
      label: Pool and host config
      description: The part of the pool or host config that matters. Redact host names, tokens and paths first.
      render: toml
    validations: { required: false }
