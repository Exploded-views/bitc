name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds the merge commit and runs these same jobs (docs/RELEASING.md).
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # vet (linux and darwin), golangci-lint, and the script self-checks, among them the shard check:
  # every conformance test is in exactly one shard.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install pinned tools
        run: |
          sh scripts/retry.sh 3 20 make tools-ci
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make lint
        run: make lint

  # Unit tests under -race, in two legs of about equal length; each leg keeps its output for the
  # coverage job.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [providers, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: make test-unit
        run: make test-unit LEG=${{ matrix.leg }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-cover-${{ matrix.leg }}
          path: dist/test-cover-${{ matrix.leg }}.txt
          if-no-files-found: error
          retention-days: 3

  # Per-package coverage floors on the merged unit output of every leg named in UNIT_LEGS (keep it
  # equal to the unit matrix; a test checks that). coverage-merge.sh refuses a leg that is missing,
  # empty or failed, so a leg that did not upload cannot pass for a package that dropped out.
  coverage:
    needs: [unit]
    # runs after a failed leg too (a skipped job would pass as a required check) and then fails on
    # the leg's missing or failed output
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-cover-*
          path: dist
          merge-multiple: true
      - name: make coverage-merge
        run: make coverage-merge UNIT_LEGS="providers core"

  # The conformance suite against a plain bitc, one leg per shard (scripts/conformance-shards.sh).
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [sh, fb-sp, dj-rr-re, rest, plugin, provider]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the whole history: the rest shard's TIM1 cap ratchet compares with main
          # (TestTIM1_CapOnlyGoesDown). A literal: in an expression 0 is falsy.
          fetch-depth: 0
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: make conformance-shard
        run: make conformance-shard SHARD=${{ matrix.shard }}

  # The same shards against a race-instrumented bitc (spec 11: -race everywhere); the long pole.
  conformance-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [sh, fb-sp, dj-rr-re, rest, plugin, provider]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: make conformance-race-shard
        run: make conformance-race-shard SHARD=${{ matrix.shard }}

  # The example configs load and every relative markdown link resolves.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: make docs
        run: make docs

  # The release config is valid and the macOS client (cgo off) cross-compiles; the macos-smoke job
  # runs it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Install pinned tools
        run: |
          sh scripts/retry.sh 3 20 make tools-ci
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: goreleaser check
        run: goreleaser check
      - name: darwin/arm64 cross-build
        run: env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/bitc
      - name: darwin/amd64 cross-build
        run: env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/bitc

  # Secret scan on every push and pull request: gitleaks over the whole history with the
  # committed .gitleaks.toml (make secrets prints counts and rule/file/commit only, never a match).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make secrets
        run: make secrets

  # The macOS client on a GitHub-hosted runner: build it, run the full unit suite, then a
  # one-slot local pool runs `true` and status reads it back (README: Linux-only features).
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      # CGO_ENABLED=0 like the releases (Makefile, .goreleaser.yaml), so CI tests what ships
      - name: build
        env:
          CGO_ENABLED: "0"
        run: go build -o bitc ./cmd/bitc
      - name: unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./internal/... ./cmd/...
      - name: smoke
        env:
          BITC_CONFIG: ${{ runner.temp }}/bitc.toml
        run: |
          printf 'version = 1\n[pools]\nsmoke = { slots = 1, wait = "1m" }\n' > "$BITC_CONFIG"
          chmod 600 "$BITC_CONFIG"
          ./bitc version
          ./bitc run smoke -- true
          ./bitc status --json
