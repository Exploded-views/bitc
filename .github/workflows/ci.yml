name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Install pinned tools
        run: |
          make tools-ci
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # lint (go vet and golangci-lint), unit tests, conformance (also -race), examples, link check
      - name: make ci
        run: make ci
      - name: goreleaser check
        run: goreleaser check
