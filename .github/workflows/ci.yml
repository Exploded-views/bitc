name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same toolchain as scripts/dev.sh pins; go.mod only states the minimum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Install pinned tools
        run: |
          make tools-ci
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # lint (go vet and golangci-lint), unit tests, conformance (also -race), examples, link check
      - name: make ci
        run: make ci
      - name: goreleaser check
        run: goreleaser check
