# Host config for the neutral python-monorepo example. Copy it to ~/.config/bitc/bitc.toml
# (mode 0600) and adjust the capacities to your machine.
version = 1
defaults = { slots = 1, wait = "10m" }
groups = { bigmem = { units = 1 } }

[host]
memory_floor = "4GiB"

[pools]
pytest = { slots = 2, wait = "30m" }
mypy = { slots = 1, wait = "30m", memory = "3GiB" }
heavy = { slots = 1, wait = "1h", memory = "6GiB", groups = { bigmem = 1 } }
